<html>
    <head>
        <title>CSS Styling</title>
        <!-- Internal CSS -->
        <style>
            h1{
                color: blue;
                text-align: center;
            }

            p{
                font-size: 16px;
                line-height: 1.5;
                color: #333;
            }
        </style>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Welcome to CSS Styling</h1>

        <p>This is a paragraph demonstrating internal CSS styling. The text is styled with a specific font size, line height, and color.</p>


        <!-- Inline CSS -->
        <h2 style="color: red; text-align: center;">
            Inline CSS Example
        </h2>
    </body>
</html>
